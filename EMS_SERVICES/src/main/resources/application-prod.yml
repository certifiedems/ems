# ems_backend/src/main/resources/application-prod.yml
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:30}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: update
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.ems: INFO
  file:
    name: /var/log/ems/ems-backend.log

app:
  storage:
    r2:
      account-id: ${R2_ACCOUNT_ID}
      access-key: ${R2_ACCESS_KEY}
      secret-key: ${R2_SECRET_KEY}
      bucket: ${R2_BUCKET:ems-profile-photos}
      # Proctoring evidence gets its own bucket and its own API token: it is
      # unbounded-growth personal data that wants a stricter credential and an
      # independent lifecycle rule, which one shared bucket could not give it.
      evidence:
        account-id: ${R2_EVIDENCE_ACCOUNT_ID}
        access-key: ${R2_EVIDENCE_ACCESS_KEY}
        secret-key: ${R2_EVIDENCE_SECRET_KEY}
        bucket: ${R2_EVIDENCE_BUCKET:ems-proctoring-evidence}
        # Set false to fall back to inline base64 without a redeploy if R2 is
        # unreachable or the token is revoked.
        enabled: ${R2_EVIDENCE_ENABLED:true}

  payment:
    razorpay:
      # Live keys and the webhook secret come from the environment only. A
      # secret in this file is a secret in the git history.
      enabled: ${RAZORPAY_ENABLED:true}
      key-id: ${RAZORPAY_KEY_ID}
      key-secret: ${RAZORPAY_KEY_SECRET}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
